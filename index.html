<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>复盘札记</title>
<style>
:root{--paper:#f3efe6;--card:#faf7f1;--ink:#1e1a16;--muted:#6f675c;--line:#e3d9c8;--up:#8e2f2a;--down:#1f6b4a;--brass:#8a5a22}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums}
button{cursor:pointer;font:inherit}
a{color:inherit;text-decoration:none}
main{max-width:32rem;margin:0 auto;min-height:100vh;padding-bottom:4rem}
header{position:sticky;top:0;z-index:10;background:rgba(243,239,230,.95);border-bottom:1px solid var(--line);padding:1rem 1rem .75rem;backdrop-filter:blur(8px)}
h1{font-family:Palatino,"Songti SC","Noto Serif SC",serif;font-size:1.875rem;margin:0;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem}
.muted{color:var(--muted)} .up{color:var(--up)} .down{color:var(--down)} .brass{color:var(--brass)}
.k{font-size:11px;letter-spacing:.16em;color:var(--muted)}
input{width:100%;margin-top:.75rem;min-height:44px;border:1px solid rgba(30,26,22,.15);background:var(--card);padding:0 .75rem;font-size:16px}
.pad{padding:0 1rem}
.card{border:1px solid var(--line);background:var(--card)}
.card.pad{padding:1rem}
h2{font-family:Palatino,"Songti SC",serif;font-size:1.5rem;margin:.25rem 0 0;font-weight:600}
p{margin:.75rem 0 0;font-size:.875rem;line-height:1.65}
.sec{margin-top:1rem}
.line{border-top:1px solid var(--line);padding-top:.75rem;margin-top:.75rem}
.hit{display:flex;min-height:56px;align-items:center;justify-content:space-between;gap:.75rem;border-bottom:1px solid var(--line);padding:.5rem .75rem}
.hit:last-child{border-bottom:0}
.tags{display:flex;gap:.5rem;overflow:auto;margin-top:1.25rem;padding-bottom:.25rem}
.tags button{min-height:44px;padding:0 1rem;border:1px solid var(--line);background:var(--card);flex:none}
.tags button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.core{display:block;margin-top:.75rem;padding:.75rem 1rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;text-align:center;margin-top:.75rem}
.g3 div{background:var(--paper);padding:.5rem .25rem}
.back{display:inline-flex;min-height:44px;align-items:center;color:var(--muted);font-size:.875rem}
.switch{display:flex;gap:.5rem;margin-top:1rem}
.switch button{min-height:44px;flex:1;border:1px solid var(--line);background:var(--card)}
.switch button.on{background:var(--ink);color:var(--paper)}
label{display:block;font-size:12px;color:var(--muted)}
label input{margin-top:.25rem}
</style>
</head>

  else if(narrow) g={pressure:s.hi,support:s.lo,entryLow:null,entryHigh:null,pattern:"窄幅涨停",where:"回撤过浅，不追",action:s.name+" 收于涨停价 "+n2(s.hi)+"，日内低点 "+n2(s.lo)+"，振幅 "+n2(range)+" 元，换手率 "+s.turn.toFixed(2)+"%。回撤过浅，不设观察区间。",avoid:"不追 "+n2(s.hi)+"。",holding:"已有持仓不加仓。跌破 "+n2(s.lo)+" 先减仓复核。"};
  else if(limit){

    g={pressure:s.hi,support:s.lo,entryLow,entryHigh,pattern:"有分歧的涨停",where:"高于观察区间上沿 "+n2(s.px-entryHigh)+" 元",action:s.name+" 压力为涨停价 "+n2(s.hi)+"，支撑为日内低点 "+n2(s.lo)+"。观察区间 "+n2(entryLow)+"–"+n2(entryHigh)+"，约自压力回撤 38%–50%。现价 "+n2(s.px)+" 贴近压力，成交额 "+s.amt+" 亿元。",avoid:"不在 "+n2(s.px)+" 追价。跌破 "+n2(s.lo)+"，该区间失效。",holding:"已有持仓不加仓。回落至 "+n2(entryLow)+"–"+n2(entryHigh)+" 再决定去留，跌破 "+n2(s.lo)+" 先减仓复核。"};
  } else if((s.hi-s.px)/Math.max(s.px,0.01)>0.02 && pos<0.82 && s.chg>-1){
    const entryHigh=r2(s.lo+0.45*range), entryLow=r2(s.lo+0.2*range), inside=s.px>=entryLow&&s.px<=entryHigh;
    g={pressure:s.hi,support:s.lo,entryLow,entryHigh,pattern:"冲高回落",where:inside?"位于观察区间，高点未站住":"自高点回落 "+n2(s.hi-s.px)+" 元，未进入观察区间",action:s.name+" 高点 "+n2(s.hi)+" 未站住，收于 "+n2(s.px)+"，自高点回落 "+n2(s.hi-s.px)+" 元。支撑 "+n2(s.lo)+"。观察区间 "+n2(entryLow)+"–"+n2(entryHigh)+"，且需在区间内重新转强。",avoid:"不追 "+n2(s.hi)+"，也不在回落过程中承接。",holding:"已有持仓先看支撑 "+n2(s.lo)+"。跌破支撑先减仓复核，不在 "+n2(s.hi)+" 补仓。"};
  } else if(s.chg<=-1 || pos<0.28){
    g={pressure:s.hi,support:s.lo,entryLow:null,entryHigh:null,pattern:"试支撑",where:"接近支撑，不抄底",action:s.name+" 当日涨跌 "+s.chg.toFixed(2)+"%，收于 "+n2(s.px)+"，距支撑 "+n2(s.lo)+" 为 "+n2(s.px-s.lo)+" 元，压力 "+n2(s.hi)+"。当前是试支撑，不是观察买点。",avoid:"不因接近日内低点而承接。",holding:"已有持仓跌破 "+n2(s.lo)+" 先减仓复核。未越过 "+n2(s.hi)+" 不加仓。"};
  } else if(pos>=0.68){
    const entryHigh=r2(s.lo+0.5*range), entryLow=r2(s.lo+0.28*range);
    g={pressure:s.hi,support:s.lo,entryLow,entryHigh,pattern:"收在上沿",where:"高于观察区间上沿 "+n2(s.px-entryHigh)+" 元",action:s.name+" 压力 "+n2(s.hi)+"，支撑 "+n2(s.lo)+"，收盘 "+n2(s.px)+" 位于区间上沿，距压力 "+n2(s.hi-s.px)+" 元。观察区间为回踩 "+n2(entryLow)+"–"+n2(entryHigh)+"，不是现价。成交额 "+s.amt+" 亿元。",avoid:"不追收盘价。",holding:"已有持仓不加仓。回落至 "+n2(entryLow)+"–"+n2(entryHigh)+" 再评估，跌破 "+n2(s.lo)+" 先减仓复核。"};
  } else {
    const entryHigh=r2(s.lo+0.48*range), entryLow=r2(s.lo+0.18*range), inside=s.px>=entryLow&&s.px<=entryHigh;
    g={pressure:s.hi,support:s.lo,entryLow,entryHigh,pattern:"区间中部",where:inside?"位于观察区间，须符合当日方向":"尚未回到观察区间",action:inside?s.name+" 现价 "+n2(s.px)+" 位于观察区间 "+n2(entryLow)+"–"+n2(entryHigh)+"。压力 "+n2(s.hi)+"，支撑 "+n2(s.lo)+"，当日涨跌 "+s.chg.toFixed(2)+"%，成交额 "+s.amt+" 亿元。价格进入区间，仍须符合当日方向。":s.name+" 压力 "+n2(s.hi)+"，支撑 "+n2(s.lo)+"。观察区间 "+n2(entryLow)+"–"+n2(entryHigh)+"，现价 "+n2(s.px)+" 尚未回到区间，成交额 "+s.amt+" 亿元。",avoid:inside?"不属于当日方向的，不因落入区间而单独开仓。":"未回到观察区间，不动作。",holding:"已有持仓以支撑 "+n2(s.lo)+" 为失效价。未到压力 "+n2(s.hi)+" 不加仓。"};
  }
  const note=NOTES[s.code];
  if(note) g.action += note.extra;
  if(!note && s.amt<0.4 && g.pattern!=="一字" && g.pattern!=="风险警示"){
    g.entryLow=null; g.entryHigh=null; g.where="成交太小"; g.pattern="流动性不够";
    g.action=s.name+" 今天成交只有 "+s.amt+" 亿，收 "+n2(s.px)+"。压力 "+n2(s.hi)+"，支撑 "+(g.support==null?"没有":n2(g.support))+"。价可以看，但接不住，没有合适切入。";
    g.avoid="不因为别的票涨了就来做这只。";
  }
  return g;
}

function draw(){
  const app=document.getElementById("app");
  app.innerHTML = page? detail(page) : home();
  const input=document.getElementById("q");
  if(input){
    input.oninput=e=>{ q=e.target.value; page=null; draw(); const n=document.getElementById("q"); if(n){ n.focus(); n.setSelectionRange(q.length,q.length);} };
  }
  app.querySelectorAll("[data-line]").forEach(b=>b.onclick=()=>{ line=b.dataset.line; draw(); });
  app.querySelectorAll("a[href^='#']").forEach(a=>a.onclick=e=>{
    e.preventDefault();
    const id=a.getAttribute("href").slice(1);
    if(id==="home"){ page=null; q=""; }
    else { page=id; held=!!book().find(x=>x.code===id); }
    draw(); window.scrollTo(0,0);
  });
  const flat=document.getElementById("flat"), long=document.getElementById("long");
  if(flat) flat.onclick=()=>{ held=false; draw(); };
  if(long) long.onclick=()=>{ held=true; draw(); };
  const save=document.getElementById("save");
  if(save) save.onclick=()=>{
    const cost=Number(document.getElementById("cost").value), weight=Number(document.getElementById("weight").value);
    if(!cost||!weight) return;
    const next=book().filter(x=>x.code!==page); next.push({code:page,cost,weight}); saveBook(next); draw();
  };
  const drop=document.getElementById("drop");
  if(drop) drop.onclick=()=>{ saveBook(book().filter(x=>x.code!==page)); draw(); };
}

function prefix(code){
  if(/^(92|83|87|43|82|8|4)/.test(code)) return "bj";
  if(code.startsWith("6")||code.startsWith("5")||code.startsWith("9")) return "sh";
  return "sz";
}

  return CORE.slice();
}
function quoteClock(time){
  if(!time) return "等待行情";
  const day=time.slice(0,10), hh=+time.slice(11,13), mm=+time.slice(14,16), mins=hh*60+mm;
  const sh=new Date(Date.now()+8*3600*1000);
  const today=sh.toISOString().slice(0,10);
  const clock=time.slice(5,7)+"月"+time.slice(8,10)+"日 "+time.slice(11,16);
  if(day!==today) return clock+" 已收盘";
  const open=(mins>=570&&mins<=690)||(mins>=780&&mins<=900);
  return open? clock+" 交易中" : clock+" 已收盘";
}
async function pullQuotes(codes){
  if(!codes.length) return;
  const url="https://qt.gtimg.cn/q="+codes.map(c=>prefix(c)+c).join(",");
  const buf=await (await fetch(url)).arrayBuffer();
  const text=new TextDecoder("gbk").decode(buf);
  let latest="";
  for(const block of text.split(";")){
    const body=(block.match(/="([^"]*)"/)||[])[1];
    if(!body||body==="1") continue;
    const p=body.split("~");
    const s=BY[p[2]];
    const px=+p[3], hi=+p[33], lo=+p[34];
    if(!s||!px||!hi||!lo) continue;
    const amount=+((p[35]||"").split("/")[2]||0);
    s.px=px; s.hi=hi; s.lo=lo; s.chg=+p[32]||0;
    s.amt=Math.round(amount/1e8*100)/100;
    s.turn=+p[38]||s.turn;
    if(p[1]) s.name=p[1].replace(/\s/g,"");
    const raw=p[30]||"";
    if(raw.length>=12) latest=raw.slice(0,4)+"-"+raw.slice(4,6)+"-"+raw.slice(6,8)+" "+raw.slice(8,10)+":"+raw.slice(10,12);
  }
  if(latest) stateText=quoteClock(latest);
}
async function pullMa(codes){
  await Promise.all(codes.filter(c=>BY[c]).slice(0,20).map(async code=>{
    try{
      const data=await (await fetch("https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param="+prefix(code)+code+",day,,,25,qfq")).json();
      const pack=data.data[prefix(code)+code]||{};
      const rows=pack.qfqday||pack.day||[];
      const closes=rows.map(r=>+r[2]).filter(n=>n>0);
      const avg=n=>{const a=closes.slice(-n); return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
      const ma5=avg(5), ma10=avg(10), ma20=avg(20);
      if(ma5&&ma10&&ma20) MA[code]=[ma5,ma10,ma20];
    }catch(e){}
  }));
}
let ticking=false;
async function refreshLive(){
  if(ticking) return;
  ticking=true;
  const codes=visibleCodes();
  try{ await pullQuotes(codes); await pullMa(codes); draw(); }
  catch(e){ if(stateText==="等待行情") stateText="行情暂时取不到"; }
  ticking=false;
}

draw();
refreshLive();
setInterval(refreshLive, 20000);
</script>
